# logminer in Kubernetes: one Deployment per SQL Server instance. Two pods with the same ServerName: one holds the lease (an application lock in SQL
# Server) and captures, the other waits and takes over; a pod that lost its lease cannot write a position any more. No volume: the position, the gaps and
# the requests are in the database `logminer` on the instance (infra/sqlserver/setup-logminer-db.sql).
apiVersion: v1
kind: Secret
metadata: { name: logminer-sql01 }
type: Opaque
stringData:
  # A SQL login (or Kerberos). Encrypt, and check the certificate: the rows of every captured table come over this connection.
  connection: "Data Source=tcp:sql01.example.internal,1433;Initial Catalog=master;User ID=logminer;Password=CHANGE-ME;Encrypt=true;TrustServerCertificate=false;Application Name=logminer;Connect Timeout=15"
---
apiVersion: v1
kind: ConfigMap
metadata: { name: logminer-sql01 }
data:
  LogMiner__ServerName: "sql01"                 # the same in every pod, and never changed: it names the stream's subjects, the lease and the position
  LogMiner__Databases__0: "tenant_*"
  LogMiner__Sink__NatsJetStream__Url: "nats://nats.nats.svc:4222"
  LogMiner__Sink__NatsJetStream__Stream: "LOGMINER"
  LogMiner__Sink__NatsJetStream__Replicas: "3"  # with three NATS servers; only used when the stream is created
  LogMiner__MaxBufferedMb: "512"                # of one transaction; see the memory limit below
  Logging__Console__FormatterName: "json"
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: logminer-sql01, labels: { app: logminer, instance: sql01 } }
spec:
  replicas: 2
  selector: { matchLabels: { app: logminer, instance: sql01 } }
  strategy: { type: RollingUpdate, rollingUpdate: { maxSurge: 1, maxUnavailable: 1 } }
  template:
    metadata:
      labels: { app: logminer, instance: sql01 }
      annotations: { prometheus.io/scrape: "true", prometheus.io/port: "8080", prometheus.io/path: "/metrics" }
    spec:
      terminationGracePeriodSeconds: 45           # it saves the last position and gives the lease up
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, runAsUser: 1654, seccompProfile: { type: RuntimeDefault } }
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - { topologyKey: kubernetes.io/hostname, labelSelector: { matchLabels: { app: logminer, instance: sql01 } } }
      containers:
        - name: logminer
          image: logminer:latest
          envFrom: [ { configMapRef: { name: logminer-sql01 } } ]
          env:
            - { name: LogMiner__ConnectionString, valueFrom: { secretKeyRef: { name: logminer-sql01, key: connection } } }
          ports: [ { name: http, containerPort: 8080 } ]
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ ALL ] } }
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { memory: 2Gi }               # no CPU limit: throttling shows up as latency
          startupProbe: { httpGet: { path: /livez, port: http }, periodSeconds: 5, failureThreshold: 24, timeoutSeconds: 5 }
          livenessProbe: { httpGet: { path: /livez, port: http }, periodSeconds: 20, failureThreshold: 3, timeoutSeconds: 5 }
          readinessProbe: { httpGet: { path: /readyz, port: http }, periodSeconds: 5, failureThreshold: 3, timeoutSeconds: 5 }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: logminer-sql01 }
spec:
  maxUnavailable: 1
  selector: { matchLabels: { app: logminer, instance: sql01 } }
