; Unattended SQL Server 2022 Developer install for the logminer dev/test host.
; Secrets (SAPWD) are passed on the command line by install-sqlserver.ps1, never stored here.
[OPTIONS]
ACTION="Install"
FEATURES=SQLENGINE
INSTANCENAME="MSSQLSERVER"
INSTANCEID="MSSQLSERVER"
SQLSVCACCOUNT="NT Service\MSSQLSERVER"
SQLSVCSTARTUPTYPE="Automatic"
; Agent stays manual: the CDC capture/cleanup jobs must never run (logminer reads the log itself).
AGTSVCACCOUNT="NT Service\SQLSERVERAGENT"
AGTSVCSTARTUPTYPE="Manual"
SECURITYMODE="SQL"
TCPENABLED="1"
NPENABLED="0"
SQLSVCINSTANTFILEINIT="True"
SQLMAXMEMORY="8192"
SQLMINMEMORY="0"
SQLCOLLATION="SQL_Latin1_General_CP1_CI_AS"
; UPDATEENABLED/UPDATESOURCE (slipstreamed local CU) are passed by install-sqlserver.ps1.
QUIET="True"
SUPPRESSPRIVACYSTATEMENTNOTICE="True"
ENU="True"
