# Local dev NATS for logminer. Loopback only; production should add TLS + NKey/JWT auth.
server_name: logminer-dev
listen: 127.0.0.1:4222
http: 127.0.0.1:8222
max_payload: 8MB

jetstream {
  store_dir: "C:/ProgramData/logminer/nats-store"
  max_memory_store: 1GB
  max_file_store: 20GB
  # An ack means the OS page cache until the next sync: a power loss on the NATS host loses what was acked since. logminer keeps every
  # change in SQL Server's log for ReleaseIntervalMs (10 s) after its checkpoint, so this has to be shorter than that (the default is 2m).
  # "always" syncs every message on its own: measured 6.5 s p50 at 200 events/s on the development disk. For "never lost" without a
  # window, use R3 (three hosts).
  sync_interval: 1s
}
