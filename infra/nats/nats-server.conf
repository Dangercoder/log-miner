# Local dev NATS for logminer. Loopback only; production should add TLS + NKey/JWT auth.
server_name: logminer-dev
listen: 127.0.0.1:4222
http: 127.0.0.1:8222
max_payload: 8MB

jetstream {
  store_dir: "C:/ProgramData/logminer/nats-store"
  max_memory_store: 1GB
  max_file_store: 20GB
  # logminer only checkpoints (and releases SQL Server log) after a JetStream ack. With the default (2m) an
  # ack only means the OS page cache: a power loss on the NATS host loses acked events. "always" fsyncs every write.
  sync_interval: always
}
